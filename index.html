<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // CONFIGURATION (Your URLs)
        // ==========================================
        const APP_CONFIG = {
            GITHUB_URL: "https://ranya23.github.io/group-creation/",
            GAS_URL: "https://script.google.com/macros/s/AKfycbyR_jxXDag-y5SYGpYBIcoS-28h9JMxclJId7Ob-Zre4K4B_NqIIJU9z5KMIwmTx-v7Kw/exec"
        };

        // --- TRANSLATIONS ---
        const translations = {
            ku: {
                dir: 'rtl',
                appTitle: 'سیستەمی تۆمارکردن',
                home: 'سەرەتا',
                groups: 'گرووپەکان',
                adminPanel: 'بەڕێوەبەرایەتی',
                full: 'پڕبووە',
                seatsLeft: 'شوێنی بەتاڵ',
                maxParticipants: 'زۆرترین بەشداربوو',
                name: 'ناوی تەواو',
                email: 'ئیمەیڵ',
                phone: 'ژمارەی مۆبایل',
                spec: 'پسپۆڕی',
                org: 'شوێنی کار / زانکۆ',
                age: 'تەمەن',
                register: 'تۆمارکردن',
                adminLogin: 'چوونەژوورەوەی بەڕێوەبەر',
                password: 'وشەی تێپەڕ (Password)',
                login: 'چوونەژوورەوە',
                createGroup: 'دروستکردنی گرووپی نوێ',
                groupName: 'ناوی گرووپ',
                color: 'ڕەنگی گرووپ',
                reqFields: 'زانیارییە داواکراوەکان',
                delete: 'سڕینەوە',
                edit: 'دەستکاری',
                success: 'کردارەکە سەرکەوتووبوو!',
                error: 'هەڵەیەک ڕوویدا!',
                duplicate: 'ئەم زانیارییە پێشتر تۆمارکراوە!',
                leader: 'سەرۆکی گروپ',
                participant: 'بەشداربوو',
                position: 'پێگە',
                search: 'گەڕان بەدوای بەشداربووان...',
                exportPdf: 'دابەزاندن PDF',
                exportWord: 'دابەزاندن Word',
                exportAllPdf: 'هەمووی PDF',
                exportAllWord: 'هەمووی Word',
                exportAllExcel: 'هەمووی Excel',
                noGroups: 'هیچ گرووپێک بوونی نییە',
                status: 'دۆخ',
                theme: 'تاریک/ڕووناک',
                addParticipant: 'تۆمارکردنی ناوی نوێ',
                loading: 'چاوەڕوان بە داتا دەهێنرێت...',
                qrCode: 'کۆدی QR'
            },
            en: {
                dir: 'ltr',
                appTitle: 'Registration System',
                home: 'Home',
                groups: 'Groups',
                adminPanel: 'Admin Panel',
                full: 'Full',
                seatsLeft: 'Seats Left',
                maxParticipants: 'Max Participants',
                name: 'Full Name',
                email: 'Email Address',
                phone: 'Phone Number',
                spec: 'Specialization',
                org: 'Organization / University',
                age: 'Age',
                register: 'Register',
                adminLogin: 'Admin Login',
                password: 'Password',
                login: 'Login',
                createGroup: 'Create New Group',
                groupName: 'Group Name',
                color: 'Group Color',
                reqFields: 'Required Information',
                delete: 'Delete',
                edit: 'Edit',
                success: 'Action Successful!',
                error: 'An error occurred!',
                duplicate: 'This information is already registered!',
                leader: 'Group Leader',
                participant: 'Participant',
                position: 'Position',
                search: 'Search participants...',
                exportPdf: 'Export PDF',
                exportWord: 'Export Word',
                exportAllPdf: 'All PDF',
                exportAllWord: 'All Word',
                exportAllExcel: 'All Excel',
                noGroups: 'No groups available',
                status: 'Status',
                theme: 'Dark/Light',
                addParticipant: 'Register New Name',
                loading: 'Loading data...',
                qrCode: 'QR Code'
            }
        };

        // NEW COLOR OPTION ADDED HERE
        const groupColors = [
            { label: 'Emerald / Teal', value: 'from-emerald-500 to-teal-700' },
            { label: 'Blue / Indigo', value: 'from-blue-500 to-indigo-700' },
            { label: 'Amber / Orange', value: 'from-amber-500 to-orange-700' },
            { label: 'Rose / Pink', value: 'from-rose-500 to-pink-700' },
            { label: 'Purple / Fuchsia', value: 'from-purple-500 to-fuchsia-700' },
            { label: 'Red / Cherry', value: 'from-red-500 to-rose-600' }, // ADDED COLOR
            { label: 'Cyan / Blue', value: 'from-cyan-400 to-blue-600' },
            { label: 'Yellow / Red', value: 'from-yellow-400 to-red-600' },
            { label: 'Slate / Gray', value: 'from-slate-600 to-gray-800' },
            { label: 'Lime / Green', value: 'from-lime-400 to-green-600' }
        ];

        const availableFields = ['phone', 'email', 'spec', 'org', 'age'];

        function App() {
            const [lang, setLang] = useState('ku');
            const [darkMode, setDarkMode] = useState(false); // DEFAULT SET TO LIGHT MODE
            const [view, setView] = useState('dashboard');
            const [groups, setGroups] = useState([]);
            const [participants, setParticipants] = useState([]);
            const [adminLoggedIn, setAdminLoggedIn] = useState(false);
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(false);
            const [showQR, setShowQR] = useState(false);

            const t = translations[lang];

            const fetchGAS = async (action, payload = {}) => {
                try {
                    setLoading(true);
                    const response = await fetch(APP_CONFIG.GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, ...payload })
                    });
                    const data = await response.json();
                    setLoading(false);
                    return data;
                } catch (err) {
                    console.error(err);
                    setLoading(false);
                    showToast(t.error, 'error');
                    return null;
                }
            };

            const loadData = async () => {
                const data = await fetchGAS('init');
                if (data) {
                    setGroups(data.groups || []);
                    setParticipants(data.participants || []);
                }
            };

            useEffect(() => { loadData(); }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            // --- EXPORTS ---
            const generateHTMLTable = (group, groupParticipants) => {
                let html = `<h2 style="color: #4f46e5; border-bottom: 2px solid #eee; padding-bottom: 10px;">${group.name}</h2>`;
                html += `<table border="1" style="width: 100%; border-collapse: collapse; text-align: ${t.dir==='rtl'?'right':'left'}; margin-bottom: 30px;">`;
                html += `<tr style="background-color: #f3f4f6;">
                <th style="padding: 10px;">#</th>
                <th style="padding: 10px;">${t.name}</th>`;
                group.fields.forEach(f => { html += `<th style="padding: 10px;">${t[f]}</th>`; });
                html += `<th style="padding: 10px;">${t.position}</th></tr>`;
                
                groupParticipants.forEach((p, i) => {
                html += `<tr>
                    <td style="padding: 8px;">${i + 1}</td>
                    <td style="padding: 8px;"><b>${p.data.name}</b></td>`;
                group.fields.forEach(f => { html += `<td style="padding: 8px;">${p.data[f] || ''}</td>`; });
                // FIRST INDEX IS ALWAYS LEADER IN EXPORT
                html += `<td style="padding: 8px; color: ${i === 0 ? '#d97706' : '#333'};"><b>${i === 0 ? t.leader : t.participant}</b></td></tr>`;
                });
                html += `</table>`;
                return html;
            };

            const executePrint = (htmlContent, title) => {
                const printWindow = window.open('', '', 'height=800,width=1000');
                printWindow.document.write(`<html dir="${t.dir}"><head><title>${title}</title>
                <style>body { font-family: Arial, sans-serif; padding: 40px; color: #333; }</style>
                </head><body><h1 style="text-align:center">${title}</h1>${htmlContent}</body></html>`);
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => { printWindow.print(); printWindow.close(); }, 500);
            };

            const executeWordDoc = (htmlContent, title) => {
                const docHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' dir="${t.dir}">
                <head><meta charset="utf-8"><title>${title}</title></head>
                <body style="font-family: Arial, sans-serif;"><h1 style="text-align:center">${title}</h1>${htmlContent}</body></html>`;
                const blob = new Blob(['\ufeff', docHtml], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${title}.doc`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const exportAllExcel = () => {
                let csv = '\uFEFF'; 
                csv += `Group,#,${t.name},${availableFields.map(f => t[f]).join(',')},${t.position}\n`;
                
                groups.forEach(group => {
                    const groupParticipants = participants.filter(p => p.groupId === group.id);
                    groupParticipants.forEach((p, i) => {
                        const row = [
                            `"${group.name}"`,
                            i + 1,
                            `"${p.data.name || ''}"`,
                            ...availableFields.map(f => `"${p.data[f] || ''}"`),
                            `"${i === 0 ? t.leader : t.participant}"` // FIRST INDEX IS LEADER IN EXCEL
                        ];
                        csv += row.join(',') + '\n';
                    });
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'All_Groups_Data.csv';
                link.click();
                URL.revokeObjectURL(url);
            };

            const exportSinglePdf = (group) => executePrint(generateHTMLTable(group, participants.filter(p => p.groupId === group.id)), group.name);
            const exportSingleWord = (group) => executeWordDoc(generateHTMLTable(group, participants.filter(p => p.groupId === group.id)), group.name);
            const exportAllPdf = () => executePrint(groups.map(g => generateHTMLTable(g, participants.filter(p => p.groupId === g.id))).join(''), t.appTitle);
            const exportAllWord = () => executeWordDoc(groups.map(g => generateHTMLTable(g, participants.filter(p => p.groupId === g.id))).join(''), "All_Groups");

            // --- REUSABLE GROUP SECTION COMPONENT ---
            const GroupSection = ({ group }) => {
                const groupParticipants = participants.filter(p => p.groupId === group.id);
                
                // INLINE EDITING STATE
                const [editId, setEditId] = useState(null);
                const [editData, setEditData] = useState({});
                
                // REGISTRATION FORM STATE (Only for new additions)
                const initialFormState = { name: '' };
                group.fields.forEach(f => initialFormState[f] = '');
                const [formData, setFormData] = useState(initialFormState);

                // Inline Edit Handlers
                const handleEditClick = (p) => {
                    setEditId(p.id);
                    setEditData(p.data);
                };

                const handleCancelEdit = () => {
                    setEditId(null);
                    setEditData({});
                };

                const handleSaveEdit = async (pId) => {
                    const res = await fetchGAS('updateParticipant', { participantId: pId, data: editData });
                    if (res && res.status === 'success') {
                        setParticipants(participants.map(p => p.id === pId ? { ...p, data: editData } : p));
                        setEditId(null);
                        showToast(t.success, 'success');
                    }
                };

                // Registration Handler
                const handleRegister = async (e) => {
                    e.preventDefault();
                    if (group.current >= group.max) return showToast(t.full, 'error');
                    const isDuplicate = groupParticipants.some(p => (formData.email && p.data.email === formData.email) || (formData.phone && p.data.phone === formData.phone));
                    if (isDuplicate) return showToast(t.duplicate, 'error');

                    const res = await fetchGAS('register', { participant: { groupId: group.id, data: formData } });
                    if (res && res.status === 'success') { 
                        await loadData(); 
                        setFormData(initialFormState); 
                        showToast(t.success, 'success'); 
                    }
                };

                const isFull = group.current >= group.max;

                return (
                    // GRADIENT BORDER WRAPPER (This adds the colored border around the group)
                    <div className={`p-1 md:p-1.5 rounded-[2rem] bg-gradient-to-r ${group.color} shadow-xl transition-all hover:shadow-2xl mb-12`}>
                        {/* INNER WHITE/DARK CONTAINER */}
                        <div className="bg-white/95 dark:bg-gray-900/95 backdrop-blur-xl p-4 md:p-8 rounded-[1.85rem] h-full">
                            
                            {/* Group Header & Downloads */}
                            <div className="flex flex-wrap gap-4 justify-between items-center mb-6 border-b border-gray-200 dark:border-gray-700 pb-4">
                                <div>
                                    <h3 className={`text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r ${group.color}`}>
                                        {group.name}
                                    </h3>
                                    <p className="text-gray-600 dark:text-gray-400 font-bold mt-1 text-sm md:text-base">
                                        {t.seatsLeft}: {group.max - group.current} / {group.max}
                                    </p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => exportSinglePdf(group)} className="flex items-center gap-1 md:gap-2 px-3 md:px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold shadow transition text-xs md:text-sm">
                                        <i className="fas fa-file-pdf"></i> <span className="hidden sm:inline">PDF</span>
                                    </button>
                                    <button onClick={() => exportSingleWord(group)} className="flex items-center gap-1 md:gap-2 px-3 md:px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow transition text-xs md:text-sm">
                                        <i className="fas fa-file-word"></i> <span className="hidden sm:inline">Word</span>
                                    </button>
                                </div>
                            </div>

                            {/* Open Table - Fully Responsive with Inline Editing */}
                            <div className="bg-gray-50/50 dark:bg-black/20 rounded-2xl border border-gray-200 dark:border-gray-700 mb-6 overflow-x-auto">
                                <table className="w-full text-left text-xs md:text-sm text-gray-800 dark:text-gray-200">
                                    <thead className="bg-gray-200/80 dark:bg-gray-800/80">
                                        <tr>
                                            <th className="p-2 md:p-4 font-bold w-8 md:w-16">No</th>
                                            <th className="p-2 md:p-4 font-bold">{t.name}</th>
                                            {group.fields.map(f => <th key={f} className="p-2 md:p-4 font-bold">{t[f]}</th>)}
                                            <th className="p-2 md:p-4 font-bold">{t.position}</th>
                                            <th className="p-2 md:p-4 font-bold text-center">{t.edit}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {groupParticipants.map((p, index) => (
                                            <tr key={p.id} className={`border-b border-gray-300/50 dark:border-gray-700/50 transition ${editId === p.id ? 'bg-indigo-50/50 dark:bg-indigo-900/20' : 'hover:bg-white/50 dark:hover:bg-black/30'}`}>
                                                
                                                <td className="p-2 md:p-4 font-bold">{index + 1}</td>
                                                
                                                {/* IF INLINE EDIT MODE IS ACTIVE FOR THIS ROW */}
                                                {editId === p.id ? (
                                                    <React.Fragment>
                                                        <td className="p-1 md:p-2">
                                                            <input type="text" value={editData.name} onChange={e => setEditData({...editData, name: e.target.value})} className="w-full px-2 py-1.5 md:py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-800 dark:text-white text-xs md:text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                                        </td>
                                                        {group.fields.map(f => (
                                                            <td key={f} className="p-1 md:p-2">
                                                                <input type={f === 'email' ? 'email' : f === 'age' ? 'number' : 'text'} value={editData[f] || ''} onChange={e => setEditData({...editData, [f]: e.target.value})} className="w-full px-2 py-1.5 md:py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-800 dark:text-white text-xs md:text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                                                            </td>
                                                        ))}
                                                    </React.Fragment>
                                                ) : (
                                                    /* NORMAL TEXT VIEW */
                                                    <React.Fragment>
                                                        <td className="p-2 md:p-4 font-extrabold text-sm md:text-base break-words min-w-[100px]">{p.data.name}</td>
                                                        {group.fields.map(f => <td key={f} className="p-2 md:p-4 break-words">{p.data[f] || '-'}</td>)}
                                                    </React.Fragment>
                                                )}

                                                <td className="p-2 md:p-4">
                                                    {/* FIRST INDEX (0) IS ALWAYS LEADER */}
                                                    {index === 0 ? (
                                                    <span className="px-2 md:px-3 py-1 bg-amber-200 text-amber-800 font-bold rounded-lg text-[10px] md:text-xs flex items-center w-max gap-1">👑 {t.leader}</span>
                                                    ) : <span className="px-2 md:px-3 py-1 bg-gray-200 dark:bg-gray-700 font-bold rounded-lg text-[10px] md:text-xs flex items-center w-max">{t.participant}</span>}
                                                </td>
                                                
                                                <td className="p-2 md:p-4 text-center">
                                                    {editId === p.id ? (
                                                        <div className="flex justify-center gap-2">
                                                            <button onClick={() => handleSaveEdit(p.id)} className="p-1.5 md:p-2 text-white bg-green-500 hover:bg-green-600 rounded-lg transition shadow-sm" title="Save">
                                                                <i className="fas fa-check"></i>
                                                            </button>
                                                            <button onClick={handleCancelEdit} className="p-1.5 md:p-2 text-white bg-red-500 hover:bg-red-600 rounded-lg transition shadow-sm" title="Cancel">
                                                                <i className="fas fa-times"></i>
                                                            </button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={() => handleEditClick(p)} className="p-1.5 md:p-2 text-blue-600 hover:bg-blue-100 dark:text-blue-400 dark:hover:bg-blue-900/30 rounded-lg transition">
                                                            <i className="fas fa-edit"></i>
                                                        </button>
                                                    )}
                                                </td>

                                            </tr>
                                        ))}
                                        {groupParticipants.length === 0 && (<tr><td colSpan="10" className="p-4 md:p-6 text-center text-gray-500 font-bold italic text-xs md:text-sm">No participants found. Be the first!</td></tr>)}
                                    </tbody>
                                </table>
                            </div>

                            {/* Registration Form ONLY */}
                            <div className="p-4 md:p-6 rounded-2xl bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-gray-700">
                                <h4 className="text-base md:text-lg font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
                                    <i className="fas fa-user-plus text-green-500"></i>
                                    {t.addParticipant}
                                </h4>
                                <form onSubmit={handleRegister} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4 items-end">
                                    <div>
                                        <label className="block text-xs md:text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">{t.name}</label>
                                        <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2 md:py-2.5 rounded-xl bg-white dark:bg-black/50 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500 outline-none text-gray-900 dark:text-white font-medium shadow-sm text-sm" />
                                    </div>
                                    {group.fields.map(field => (
                                    <div key={field}>
                                        <label className="block text-xs md:text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">{t[field]}</label>
                                        <input required type={field === 'email' ? 'email' : field === 'age' ? 'number' : 'text'} value={formData[field]} onChange={e => setFormData({...formData, [field]: e.target.value})} className="w-full px-4 py-2 md:py-2.5 rounded-xl bg-white dark:bg-black/50 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500 outline-none text-gray-900 dark:text-white font-medium shadow-sm text-sm" />
                                    </div>
                                    ))}
                                    <div className="flex gap-2 w-full lg:col-span-full mt-2">
                                        <button type="submit" disabled={isFull} className={`flex-1 py-2.5 md:py-3 rounded-xl font-extrabold text-white shadow-md transition-all active:scale-95 text-sm md:text-base bg-gradient-to-r ${group.color} disabled:opacity-50`}>
                                            {t.register}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            };

            const Toast = () => toast && (
                <div className={`fixed bottom-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 text-white font-bold flex items-center gap-2 animate-bounce ${toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                    <i className={`fas ${toast.type === 'success' ? 'fa-check' : 'fa-times'}`}></i> {toast.message}
                </div>
            );

            const Navbar = () => (
                <nav className="w-full backdrop-blur-xl bg-white/10 dark:bg-black/20 border-b border-gray-200/20 dark:border-white/10 sticky top-0 z-40 transition-colors duration-300">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
                    <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('dashboard')}>
                        <div className="p-2 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-xl shadow-lg flex items-center justify-center w-8 h-8 md:w-10 md:h-10">
                            <i className="fas fa-users text-white text-base md:text-lg"></i>
                        </div>
                        <span className="font-bold text-lg md:text-xl text-gray-800 dark:text-white sm:block">{t.appTitle}</span>
                    </div>

                    <div className="flex items-center gap-1 sm:gap-4">
                        <button onClick={() => setShowQR(true)} className="flex items-center gap-2 px-2 md:px-3 py-1.5 rounded-lg bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300 font-bold hover:scale-105 transition text-xs md:text-sm">
                            <i className="fas fa-qrcode"></i> <span className="hidden sm:inline">{t.qrCode}</span>
                        </button>
                        <button onClick={() => setLang(lang === 'ku' ? 'en' : 'ku')} className="flex items-center gap-2 px-2 md:px-3 py-1.5 rounded-lg bg-gray-100/50 dark:bg-white/5 hover:bg-gray-200 dark:hover:bg-white/10 transition font-bold text-gray-700 dark:text-gray-200 text-xs md:text-sm">
                            <i className="fas fa-globe"></i> {lang === 'ku' ? 'EN' : 'کوردی'}
                        </button>
                        <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg bg-gray-100/50 dark:bg-white/5 hover:bg-gray-200 dark:hover:bg-white/10 transition text-gray-700 dark:text-gray-200">
                            <i className={`fas ${darkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                        </button>
                        <button onClick={() => view === 'adminPanel' ? setView('dashboard') : setView('adminLogin')} className="p-2 rounded-lg text-gray-400 hover:text-indigo-500 dark:hover:text-indigo-400 transition sm:ml-2">
                            <i className={`fas ${adminLoggedIn && view === 'adminPanel' ? 'fa-sign-out-alt' : 'fa-shield-alt'}`}></i>
                        </button>
                    </div>
                </div>
                </nav>
            );

            const Dashboard = () => (
                <div className="space-y-8 md:space-y-12 animate-fade-in max-w-6xl mx-auto">
                    <div className="text-center space-y-2 md:space-y-4 py-4 md:py-8">
                        <h1 className="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400">{t.groups}</h1>
                    </div>
                    
                    {groups.length === 0 && <div className="text-center py-12 text-gray-500 font-bold text-lg md:text-xl">{t.noGroups}</div>}
                    
                    <div className="flex flex-col">
                        {groups.map(group => <GroupSection key={group.id} group={group} />)}
                    </div>
                </div>
            );

            const AdminLogin = () => {
                const [pwd, setPwd] = useState('');
                const handleLogin = (e) => {
                    e.preventDefault();
                    if (pwd === 'Admin123') { setAdminLoggedIn(true); setView('adminPanel'); showToast(t.success); } 
                    else showToast(t.error, 'error');
                };
                return (
                <div className="max-w-sm mx-auto mt-10 md:mt-20 animate-fade-in backdrop-blur-xl bg-white/50 dark:bg-black/50 border border-white/20 p-8 rounded-3xl shadow-2xl text-center">
                    <i className="fas fa-lock text-indigo-600 text-5xl mb-4"></i>
                    <h2 className="text-2xl font-bold dark:text-white mb-6">{t.adminLogin}</h2>
                    <form onSubmit={handleLogin} className="space-y-4">
                    <input required type="password" placeholder={t.password} value={pwd} onChange={e => setPwd(e.target.value)} className="w-full px-4 py-3 text-center rounded-xl bg-white dark:bg-black/50 border border-gray-300 dark:border-gray-700 outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white" />
                    <button type="submit" className="w-full py-3 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition">{t.login}</button>
                    </form>
                </div>
                );
            };

            const AdminPanel = () => {
                const [newGroup, setNewGroup] = useState({ name: '', color: groupColors[0].value, max: 10, fields: [] });
                const toggleField = (field) => setNewGroup(prev => ({ ...prev, fields: prev.fields.includes(field) ? prev.fields.filter(f => f !== field) : [...prev.fields, field] }));

                const handleCreateGroup = async (e) => {
                    e.preventDefault();
                    const res = await fetchGAS('createGroup', { password: 'Admin123', group: newGroup });
                    if (res && res.status === 'success') { await loadData(); setNewGroup({ name: '', color: groupColors[0].value, max: 10, fields: [] }); showToast(t.success); }
                };

                const handleDeleteGroup = async (id) => {
                    if(confirm('Are you sure you want to delete this group?')) {
                        const res = await fetchGAS('deleteGroup', { password: 'Admin123', groupId: id });
                        if (res && res.status === 'success') { await loadData(); showToast(t.success); }
                    }
                };

                return (
                <div className="space-y-8 animate-fade-in max-w-6xl mx-auto">
                    <div className="flex flex-wrap justify-between items-center bg-white/50 dark:bg-black/50 p-6 rounded-3xl shadow-lg gap-4">
                        <h2 className="text-2xl md:text-3xl font-bold dark:text-white flex items-center gap-3"><i className="fas fa-columns"></i> {t.adminPanel}</h2>
                        <div className="flex flex-wrap gap-2 md:gap-3">
                            <button onClick={exportAllPdf} className="flex items-center gap-2 px-3 py-2 bg-red-600 text-white font-bold rounded-xl shadow hover:bg-red-700 text-sm md:text-base"><i className="fas fa-file-pdf"></i> <span className="hidden sm:inline">{t.exportAllPdf}</span></button>
                            <button onClick={exportAllWord} className="flex items-center gap-2 px-3 py-2 bg-blue-600 text-white font-bold rounded-xl shadow hover:bg-blue-700 text-sm md:text-base"><i className="fas fa-file-word"></i> <span className="hidden sm:inline">{t.exportAllWord}</span></button>
                            <button onClick={exportAllExcel} className="flex items-center gap-2 px-3 py-2 bg-green-600 text-white font-bold rounded-xl shadow hover:bg-green-700 text-sm md:text-base"><i className="fas fa-file-excel"></i> <span className="hidden sm:inline">{t.exportAllExcel}</span></button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div className="bg-white/60 dark:bg-gray-900/60 p-6 rounded-3xl shadow-xl h-fit border border-white/10">
                        <h3 className="text-xl font-bold dark:text-white mb-6">{t.createGroup}</h3>
                        <form onSubmit={handleCreateGroup} className="space-y-4">
                        <div>
                            <label className="block text-sm font-bold text-gray-600 dark:text-gray-400 mb-1">{t.groupName}</label>
                            <input required value={newGroup.name} onChange={e=>setNewGroup({...newGroup, name:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-white dark:bg-black/40 border border-gray-300 dark:border-gray-700 outline-none dark:text-white" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-gray-600 dark:text-gray-400 mb-1">{t.maxParticipants}</label>
                            <input required type="number" min="1" value={newGroup.max} onChange={e=>setNewGroup({...newGroup, max: Number(e.target.value)})} className="w-full px-4 py-3 rounded-xl bg-white dark:bg-black/40 border border-gray-300 dark:border-gray-700 outline-none dark:text-white" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-gray-600 dark:text-gray-400 mb-1">{t.color}</label>
                            <select value={newGroup.color} onChange={e=>setNewGroup({...newGroup, color:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-white dark:bg-black/40 border border-gray-300 dark:border-gray-700 outline-none dark:text-white">
                            {groupColors.map((c, i) => <option key={i} value={c.value}>{c.label}</option>)}
                            </select>
                        </div>
                        <div className="p-4 bg-white/50 dark:bg-black/30 rounded-xl border border-gray-200 dark:border-gray-700">
                            <label className="block text-sm font-bold text-gray-800 dark:text-gray-200 mb-3">{t.reqFields}</label>
                            <div className="space-y-2 grid grid-cols-2">
                                <label className="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400 opacity-70 col-span-2"><input type="checkbox" checked disabled className="rounded" /> {t.name} (Required)</label>
                                {availableFields.map(field => (
                                    <label key={field} className="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-gray-300 cursor-pointer">
                                    <input type="checkbox" checked={newGroup.fields.includes(field)} onChange={() => toggleField(field)} className="rounded cursor-pointer" /> {t[field]}
                                    </label>
                                ))}
                            </div>
                        </div>
                        <button type="submit" className="w-full py-3.5 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md flex justify-center gap-2 mt-4"><i className="fas fa-plus mt-1"></i> {t.createGroup}</button>
                        </form>
                    </div>

                    <div className="lg:col-span-2 space-y-4">
                        {groups.map(group => (
                        <div key={group.id} className="bg-white/70 dark:bg-gray-900/70 p-4 md:p-5 rounded-2xl flex justify-between items-center shadow-md hover:shadow-lg transition border border-white/10">
                            <div className="flex items-center gap-3 md:gap-4">
                            <div className={`w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-gradient-to-br ${group.color} flex items-center justify-center text-white font-bold text-base md:text-lg shadow-md`}>{group.current}/{group.max}</div>
                            <div>
                                <h4 className="font-bold dark:text-white text-base md:text-lg">{group.name}</h4>
                                <p className="text-xs font-bold text-gray-500 dark:text-gray-400 mt-1">Fields: {group.fields.length === 0 ? 'Name Only' : `Name, ${group.fields.join(', ')}`}</p>
                            </div>
                            </div>
                            <button onClick={() => handleDeleteGroup(group.id)} className="p-2 md:p-3 text-white bg-red-500 hover:bg-red-600 rounded-xl shadow transition"><i className="fas fa-trash"></i></button>
                        </div>
                        ))}
                    </div>
                    </div>
                </div>
                );
            };

            return (
                <div className={`min-h-screen transition-colors duration-500 font-sans ${darkMode ? 'dark' : ''}`} dir={t.dir}>
                <div className="min-h-screen bg-[#f3f4f6] dark:bg-[#0f172a] bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] dark:bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
                    <Navbar />
                    {loading && <div className="fixed top-0 left-0 w-full h-1 bg-indigo-500 animate-pulse z-50"></div>}
                    
                    {showQR && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowQR(false)}>
                        <div className="bg-white dark:bg-gray-900 p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-full text-center" onClick={e => e.stopPropagation()}>
                        <h3 className="text-2xl font-bold text-gray-800 dark:text-white mb-6">{t.qrCode}</h3>
                        <div className="bg-white p-4 rounded-xl shadow-inner border-2 border-gray-100">
                            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(APP_CONFIG.GITHUB_URL)}`} alt="QR Code" className="w-48 h-48" />
                        </div>
                        <p className="mt-4 text-sm font-bold text-gray-500 dark:text-gray-400">Scan to open on mobile</p>
                        <button onClick={() => setShowQR(false)} className="mt-6 w-full py-3 bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-white rounded-xl font-bold hover:bg-gray-300 transition">{t.cancel}</button>
                        </div>
                    </div>
                    )}

                    <main className="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-4 md:py-8">
                    {view === 'dashboard' && <Dashboard />}
                    {view === 'adminLogin' && <AdminLogin />}
                    {view === 'adminPanel' && adminLoggedIn && <AdminPanel />}
                    </main>
                    <Toast />
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
